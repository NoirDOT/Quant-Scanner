# Quant Scanner — Scheduled Discord Signals
# ----------------------------------------------------------
# Runs the scanner aligned to 4h bar closes (01,05,09,13,17,21 UTC)
# and dispatches cross-sweep-deduped Discord setup alerts.
#
# GitHub Actions free tier = 2,000 min/month for private repos (unlimited for public).
# One scan takes ~30s = ~90 min/month for 6 sweeps/day.
#
# Manual trigger:
#   GitHub repo → Actions tab → "Scanner Sweep" → Run workflow
# ----------------------------------------------------------

name: Scanner Sweep

on:
  schedule:
    # 5 minutes after each 4h bar CLOSE.
    # With 21:00 UTC alignment, bars close at 01, 05, 09, 13, 17, 21 UTC.
    # (5-min offset gives Yahoo time to publish the closed bar)
    - cron: "5 1,5,9,13,17,21 * * *"

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger scanner sweep
        run: |
          echo "=== Triggering scanner at $(date -u) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SCANNER_URL || 'https://quant-scanner-g7r7.vercel.app' }}/api/scanner/ping")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scanner returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "=== Scan complete ==="
