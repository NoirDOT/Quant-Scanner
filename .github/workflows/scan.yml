# Quant Scanner — Scheduled Discord Signals
# ----------------------------------------------------------
# Runs the scanner aligned to 4h bar closes (00, 04, 08, 12, 16, 20 UTC)
# and dispatches Discord alerts for any signal scoring >= 30 (cross-sweep
# deduped — a 4h setup that already alerted won't re-fire).
#
# This REPLACES Vercel Cron (Hobby plan = 1/day max).
# GitHub Actions free tier = 2,000 min/month for private repos (unlimited for public).
# One scan takes ~30s = ~360 min/month for 6 sweeps/day.
#
# You can also trigger a scan manually:
#   GitHub repo → Actions tab → "Scanner Sweep" → Run workflow
# ----------------------------------------------------------

name: Scanner Sweep

on:
  schedule:
    # 5 minutes after each 4h bar close: 00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC
    # (5-min offset gives Yahoo time to publish the closed bar)
    - cron: "5 0,4,8,12,16,20 * * *"

  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger scanner sweep
        run: |
          echo "=== Triggering scanner at $(date -u) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SCANNER_URL || 'https://quant-scanner-g7r7.vercel.app' }}/api/scanner/ping")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scanner returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "=== Scan complete ==="
