# Quant Scanner — Scheduled Discord Signals + Forward-Test Resolver
# ----------------------------------------------------------
# Two jobs:
#   1. scan     — runs the scanner aligned to 4h bar closes (01,05,09,13,17,21 UTC)
#                 and dispatches cross-sweep-deduped Discord alerts.
#   2. resolve  — nightly job that replays subsequent candles for each
#                 unresolved ForwardTestSignal to compute R multiples.
#
# This REPLACES Vercel Cron (Hobby plan = 1/day max).
# GitHub Actions free tier = 2,000 min/month for private repos (unlimited for public).
# One scan takes ~30s = ~90 min/month for 6 sweeps/day.
# Resolve runs once/day and takes ~60s.
#
# You can also trigger either manually:
#   GitHub repo → Actions tab → "Scanner Sweep" or "Resolve Forward Tests" → Run workflow
# ----------------------------------------------------------

name: Scanner Sweep

on:
  schedule:
    # ── Scanner: 5 minutes after each 4h bar CLOSE.
    # With 21:00 UTC alignment, bars close at 01, 05, 09, 13, 17, 21 UTC.
    # (5-min offset gives Yahoo time to publish the closed bar)
    - cron: "5 1,5,9,13,17,21 * * *"
    # ── Forward-test resolver: nightly at 23:30 UTC (after the 21:05 scan finishes)
    - cron: "30 23 * * *"

  # Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (scan or resolve)"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - resolve

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'schedule' || github.event.inputs.job == 'scan' || github.event_name == 'workflow_dispatch' && github.event.inputs.job == ''

    steps:
      - name: Trigger scanner sweep
        run: |
          echo "=== Triggering scanner at $(date -u) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SCANNER_URL || 'https://quant-scanner-g7r7.vercel.app' }}/api/scanner/ping")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scanner returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "=== Scan complete ==="

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event.inputs.job == 'resolve'

    steps:
      - name: Resolve forward-test signals
        run: |
          echo "=== Resolving forward-test signals at $(date -u) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.API_SECRET }}" \
            "${{ vars.SCANNER_URL || 'https://quant-scanner-g7r7.vercel.app' }}/api/scanner/forward-tests/resolve?batch=200")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Resolve returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "=== Resolve complete ==="
