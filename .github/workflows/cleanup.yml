# Quant Scanner — Discord Channel Cleanup
# ----------------------------------------------------------
# Nightly job that deletes old signal messages from the Discord channel
# so it doesn't get cluttered. Uses the Discord bot token.
#
# Runs once/day at 22:00 UTC (before the 21:05 scan + resolve at 23:30).
# Deletes messages older than 24 hours.
#
# Manual trigger:
#   GitHub repo → Actions tab → "Discord Cleanup" → Run workflow
# ----------------------------------------------------------

name: Discord Cleanup

on:
  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      maxAgeHours:
        description: "Delete messages older than this many hours"
        required: false
        default: "24"
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete old Discord messages
        run: |
          MAX_AGE="${{ github.event.inputs.maxAgeHours || '24' }}"
          echo "=== Cleaning up Discord messages older than ${MAX_AGE}h at $(date -u) ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.API_SECRET }}" \
            "${{ vars.SCANNER_URL || 'https://quant-scanner-g7r7.vercel.app' }}/api/scanner/cleanup?maxAgeHours=${MAX_AGE}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cleanup returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "=== Cleanup complete ==="
